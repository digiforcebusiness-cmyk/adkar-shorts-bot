# Publishes six adkar per day to the owner's own YouTube channel - the most
# the default API quota affords (10,000 units / 1,600 per videos.insert).
# PUBLISH_COUNT overrides the count; see README section 6.
#
# Uploads land PRIVATE: the OAuth app is unverified, and Google forces private
# for unverified clients regardless of what the API sends. Publishing each
# video is a manual step in YouTube Studio.
#
# GitHub disables scheduled workflows after 60 days of repository inactivity.
# The commit-back step below writes data/state.json on every run, which keeps
# the repo active and the schedule alive as a side effect.
name: publish

on:
  schedule:
    # 06:00 UTC daily. GitHub's cron is best-effort and can be delayed
    # 5-30+ minutes under load; exact publish time is not a requirement.
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -e ".[dev]"
      - run: pytest -v
        env:
          CHANNEL_HANDLE: ${{ vars.CHANNEL_HANDLE }}

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -e .
      - run: python -m adkar_bot.cli publish
        env:
          CHANNEL_HANDLE: ${{ vars.CHANNEL_HANDLE }}
          PRIVACY_STATUS: ${{ vars.PRIVACY_STATUS }}
          PUBLISH_COUNT: ${{ vars.PUBLISH_COUNT }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      - name: Commit rotation state
        # always(): a partial run still uploaded videos, and its
        # state must be committed or the next run repeats them.
        if: always()
        run: |
          git config user.name  "adkar-bot"
          git config user.email "adkar-bot@users.noreply.github.com"
          git add data/state.json
          git diff --staged --quiet && exit 0
          git commit -m "chore: rotation state [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "push attempt $i failed; retrying"
            sleep 5
          done
          echo "::error::could not persist data/state.json - the next run will repeat this dhikr"
          exit 1
